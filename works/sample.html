<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>サンプル小説</title>

  <link
    rel="stylesheet"
    href="../style.css"
  >

  <style>

    .novel {
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .novel-header {
      margin-bottom: 40px;
    }

    .novel-title {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .novel-meta {
      color: #777;
      font-size: 14px;
    }

    .novel-body {
      font-family:
        "Yu Mincho",
        "Hiragino Mincho ProN",
        serif;

      font-size: 16px;
      line-height: 2;
      white-space: pre-wrap;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 30px;
    }

    @media (max-width: 600px) {

      .novel {
        padding-top: 25px;
      }

      .novel-title {
        font-size: 21px;
      }

      .novel-body {
        font-size: 16px;
        line-height: 2;
      }

    }

  </style>

</head>

<body>

  <main class="novel">

    <a class="back-link" href="../index.html">
      ← 作品一覧へ
    </a>

    <div class="novel-header">

      <h1 class="novel-title">
        サンプル小説
      </h1>

      <div class="novel-meta">
        全年齢 / 短編
      </div>

    </div>

    <div class="novel-body">
　ここに本文を書きます。

「セリフはこんな感じ」

　改行も、そのまま表示されます。

　段落ごとに本文を貼っていけばOKです。
    </div>

  </main>

</body>

</html>
